<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Bull Racing</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="entrada">
      <h1 class="title">Red Bull Racing</h1>
    </div>

    <hr class="line">

    <nav class="navegar">
      <ul class="nav-list">
        <li class="nav-item"><a href="#">Home</a></li>
        <li class="nav-item"><a href="#">Botões</a></li>
        <li class="nav-item"><a href="#">Loader</a></li>
      </ul>
    </nav>
  </header>

  <div class="card-grid">
    <div class="container-box">
      <div class="box-glass">
        <div class="slider">
          <img class="a" src="./images/carro-1.png" alt="Imagem 1">
          <img class="a" src="./images/carro-2.jpg" alt="Imagem 2">
          <img class="a" src="./images/carro-3.jpg" alt="Imagem 3">
          <img class="a" src="./images/carro-4.jpg" alt="Imagem 4">
          <img class="a" src="./images/carro-5.jpg" alt="Imagem 5">
        </div>
      </div>

      <div class="container-box">
        <div class="box-glass">
          <button class="btn-carro">
            <img src="./images/carro-2.jpg" alt="Carro 2" class="btn-carro-img">
          </button>
          <h1 class="btn-carro-title">Explore mais</h1>
        </div>
      </div>



    </div>
  </div>

</body>

</html>
